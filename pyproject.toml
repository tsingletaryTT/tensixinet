[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensixinet"
version = "0.3.1"
description = "Tenstorrent chip telemetry played as a chorus of Ciat-Lonbarde-style devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tenstorrent USA, Inc." }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = ["numpy", "soundfile"]

[project.optional-dependencies]
dev = ["pytest"]
midi = ["mido", "python-rtmidi"]

[project.scripts]
tensixinet = "tensixinet.cli:main"

[tool.setuptools.packages.find]
include = ["tensixinet*"]

[tool.setuptools.package-data]
tensixinet = ["media/*.conf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Explicit rather than relying on an editable install or the cwd.
pythonpath = ["."]
markers = [
    "hardware: opens /dev/tenstorrent/* - needs a gozer lease; skipped unless --run-hardware",
    "sim: runs a kernel in the TT-Lang simulator; skipped unless TT_LANG_SIM names a tt-lang-sim from an environment with no real ttnn",
]
