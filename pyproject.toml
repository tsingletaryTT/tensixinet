[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensixinet"
version = "0.2.0"
description = "Tenstorrent chip telemetry played as a chorus of Ciat-Lonbarde-style devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "soundfile"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tensixinet = "tensixinet.cli:main"

[tool.setuptools.packages.find]
include = ["tensixinet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Explicit rather than relying on an editable install or the cwd.
pythonpath = ["."]
markers = [
    "hardware: opens /dev/tenstorrent/* - needs a gozer lease; skipped unless --run-hardware",
]
