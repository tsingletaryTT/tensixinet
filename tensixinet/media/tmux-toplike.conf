# tmux config for the `--with-tt-toplike` session only. It is loaded with `-L tensixinet -f this-file`, so it never touches your own tmux
# (and your ~/.tmux.conf never touches it). The same settings tt-demo-maker uses for its recordings, which is why tt-toplike looks right here.
#
# -f is only honoured when tmux starts a new server for that socket, so the session has a socket of its own.
set -g status off

# Truecolor. Without it tmux flattens the 24-bit colours tt-toplike draws (its gradients, the TT palette) to the 256-colour cube, which
# shows as banding. terminal-features (tmux 3.2 and later) says the outer terminal does RGB whatever $TERM is; terminal-overrides covers older
# builds. COLORTERM is what most programs check before they choose 24-bit output.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
setenv -g COLORTERM truecolor
